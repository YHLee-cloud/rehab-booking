<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登入 - 復健科自費療程預約系統</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>🏥 復健科自費療程預約系統</h1>
      <p class="sub">請輸入帳號密碼登入</p>
      <div id="error-host"></div>
      <form id="login-form">
        <div class="field">
          <label>帳號</label>
          <input type="text" id="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label>密碼</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <button class="btn" type="submit">登入</button>
      </form>
      <p class="hint" style="margin-top:16px;">預設帳號：admin ／ 密碼：admin123（請登入後至內部維護修改密碼）</p>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorHost = document.getElementById('error-host');
      errorHost.innerHTML = '';
      try {
        await api('/auth/login', { method: 'POST', body: JSON.stringify({ username, password }) });
        window.location.href = '/index.html';
      } catch (err) {
        errorHost.innerHTML = `<div class="error-box">${err.message}</div>`;
      }
    });

    // 若已登入則直接導向排程頁
    (async () => {
      try {
        await api('/auth/me');
        window.location.href = '/index.html';
      } catch (e) { /* 尚未登入，停留在登入頁 */ }
    })();
  </script>
</body>
</html>
